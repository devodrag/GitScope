[package]
name = "gitscope"
version = "0.1.5"
description = "Desktop analytics for public GitHub projects"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:gtk"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
futures-executor = "0.3"
gtk = { version = "0.18", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite"] }
tauri = { version = "=2.12.5", optional = true, features = ["image-png", "unstable"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"

tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
